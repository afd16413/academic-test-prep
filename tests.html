<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests | IELTS Academic Practice</title>
<style>
:root{--primary:#1d4ed8;--accent:#f97316;--paper:#f8fafc;--muted:#374151}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--primary);color:#fff;border-bottom:4px solid var(--accent)}
.bar,main{max-width:900px;margin:auto;padding:22px 24px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.04em;color:inherit;text-decoration:none}.brand span{color:var(--accent)}
.bar nav{display:flex;gap:10px;align-items:center}
.bar a,.bar button{border:0;border-radius:8px;background:var(--surface);color:var(--primary);padding:9px 14px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.bar a.gold{background:var(--accent)}
main{padding-top:50px}
h1,h2{color:var(--primary)}
p{line-height:1.6;color:var(--muted)}
#status{overflow-wrap:anywhere}
.card{margin-top:24px;background:var(--surface);border:1px solid #dde3ea;border-radius:14px;padding:24px}
.test{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid #dde3ea;border-radius:12px;padding:18px;margin-top:14px}
.test h3{margin:0 0 4px;color:var(--primary)}
.test small{color:var(--muted)}
.test .actions{display:flex;gap:8px}
.test a,.test button{background:var(--primary);color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:8px;border:0;font:inherit;cursor:pointer}
.test button.danger{background:#b42318}
.test{border-color:var(--line)}
.subgroup{margin-top:18px;padding-left:12px;border-left:3px solid var(--line)}
.subgroup h3{margin:0;color:var(--text);font-size:1rem}
.nick-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nick-form input{flex:1;min-width:180px;padding:10px 12px;border:1px solid #dde3ea;border-radius:8px;font:inherit}
.nick-form button{background:var(--primary);color:#fff;font:inherit;font-weight:700;padding:10px 16px;border:0;border-radius:8px;cursor:pointer}
.nick-note{font-size:.95rem}
</style>
<link rel="stylesheet" href="css/site.css">
<script src="js/theme.js"></script>
</head>
<body>
<header class="site-header" id="siteHeader"></header>
<script src="js/site-nav.js"></script>
<main>
  <h1 id="pageTitle">Tests</h1>
  <p id="status">Checking your session…</p>

  <section id="guestBox" class="card" hidden>
    <h2>Your nickname</h2>
    <p class="nick-note">You can take tests without an account. Choose a nickname: your teacher sees it with your answers.</p>
    <form id="nickForm" class="nick-form">
      <input id="nickInput" type="text" maxlength="40" placeholder="e.g. Maya" autocomplete="nickname" required>
      <button type="submit">Save nickname</button>
    </form>
  </section>

  <div id="testList"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yfsxbiqszvrqhsdcuwyr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH';
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

if (!window.supabase) {
  $('status').textContent = 'Could not load the Supabase client library. Check your connection and refresh.';
} else {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const KINDS = [['reading', 'Reading Tests'], ['listening', 'Listening Tests'], ['writing', 'Writing Tests'], ['speaking', 'Speaking Tests']];
  const UNGROUPED = 'Other tests';
  // Opened from the skill buttons on the main page (tests.html?skill=reading): only that skill is listed.
  const SKILL = new URLSearchParams(window.location.search).get('skill');
  const SKILL_NAMES = { reading: 'Reading', listening: 'Listening', writing: 'Writing', speaking: 'Speaking' };
  const SKILL_MODE = !!SKILL_NAMES[SKILL];

  function testRow(t, isAdmin) {
    return `
      <div class="test">
        <div>
          <h3>${esc(t.label || t.title)}</h3>
          <small>${esc(t.minutes)} minutes</small>
        </div>
        <div class="actions">
          <button type="button" data-open="${esc(t.id)}">Start test</button>
          ${isAdmin ? `<button type="button" class="danger" data-delete="${esc(t.id)}">Delete</button>` : ''}
        </div>
      </div>`;
  }

  // Tests are listed by skill (Reading, Listening, Writing, Speaking). Inside each skill, tests are grouped
  // by their group (e.g. "Academic Test 17"), and each group lists its tests in order: Test 1, Test 2 …
  // With ?skill=… only that skill is shown.
  async function loadTests(isAdmin) {
    const { data, error } = await client.from('tests').select('id,title,label,minutes,kind,series').order('created_at', { ascending: true });
    const list = $('testList');
    if (error) { list.innerHTML = `<p>Could not load the other tests: ${esc(error.message)}</p>`; return; }
    if (!data.length) { list.innerHTML = ''; return; }

    const skills = SKILL_MODE ? [SKILL] : KINDS.map(([kind]) => kind);
    list.innerHTML = skills.map(kind => {
      const items = data.filter(t => (t.kind || 'reading') === kind);
      if (!items.length) return SKILL_MODE ? `<p>No ${esc(SKILL_NAMES[kind].toLowerCase())} tests yet.</p>` : '';

      const groups = new Map();
      items.forEach(t => {
        const key = (t.series || '').trim() || UNGROUPED;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      });
      // "Other tests" (tests without a group) goes last.
      const entries = [...groups].sort(([a], [b]) => (a === UNGROUPED) - (b === UNGROUPED));

      const body = entries.map(([name, its]) => {
        const sorted = [...its].sort((a, b) => (a.label || a.title).localeCompare(b.label || b.title, undefined, { numeric: true }));
        return `<div class="subgroup"><h3>${esc(name)}</h3>${sorted.map(t => testRow(t, isAdmin)).join('')}</div>`;
      }).join('');
      return `<section class="card"><h2>${esc(SKILL_NAMES[kind])} tests</h2>${body}</section>`;
    }).join('');
  }

  // Guests have no account. They choose a nickname, kept in this browser under "guestNickname".
  // The test pages read the same key when they save answers.
  const NICK_KEY = 'guestNickname';
  function getNickname() {
    try { return (localStorage.getItem(NICK_KEY) || '').trim(); } catch (e) { return ''; }
  }
  function setNickname(name) {
    try { localStorage.setItem(NICK_KEY, name); } catch (e) { /* private mode: the nickname lasts only this page */ }
  }
  let signedIn = false;

  function showGuestStatus() {
    const nick = getNickname();
    $('status').textContent = nick
      ? 'Taking tests as ' + nick + '. Sign in to keep your scores in "My results".'
      : 'Choose a nickname below to start a test. No account needed.';
    $('nickInput').value = nick;
    $('guestBox').hidden = false;
  }

  async function openTest(id) {
    if (!signedIn && !getNickname()) {
      $('guestBox').scrollIntoView({ behavior: 'smooth' });
      $('nickInput').focus();
      alert('Please choose a nickname first.');
      return;
    }
    // Open the tab first so the browser does not block it, then load the test into it.
    const win = window.open('', '_blank');
    const { data, error } = await client.from('tests').select('html').eq('id', id).single();
    if (error || !data) {
      if (win) win.close();
      alert('Could not open this test. Please try again.');
      return;
    }
    // A blob page cannot follow the relative "index.html" link, so point it at the site.
    const page = data.html.replace(/href="index\.html"/g, `href="${window.location.origin}/index.html"`);
    const url = URL.createObjectURL(new Blob([page], { type: 'text/html' }));
    if (win) win.location.href = url; else window.location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  async function deleteTest(id, isAdmin) {
    if (!confirm('Delete this test? Students will no longer see it.')) return;
    const { error } = await client.from('tests').delete().eq('id', id);
    if (error) { alert('Could not delete the test: ' + error.message); return; }
    loadTests(isAdmin);
  }

  async function init() {
    if (SKILL_MODE) {
      $('pageTitle').textContent = SKILL_NAMES[SKILL] + ' tests';
      document.title = SKILL_NAMES[SKILL] + ' tests | IELTS Academic Practice';
    }

    // Signed-in users get their email shown and admin tools. Guests get the nickname box.
    const { data } = await client.auth.getSession();
    const session = data.session;
    signedIn = !!session;
    let isAdmin = false;
    if (session) {
      $('status').textContent = 'Signed in as ' + session.user.email + '.';
      // Admins are the users listed in the "admins" table. The database policies enforce this too.
      const { data: admin } = await client.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
      isAdmin = !!admin;
    } else {
      showGuestStatus();
      $('nickForm').addEventListener('submit', e => {
        e.preventDefault();
        const name = $('nickInput').value.trim();
        if (!name) return;
        setNickname(name.slice(0, 40));
        showGuestStatus();
      });
    }
    await loadTests(isAdmin);

    $('testList').addEventListener('click', e => {
      const open = e.target.closest('[data-open]');
      const del = e.target.closest('[data-delete]');
      if (open) openTest(open.dataset.open);
      if (del) deleteTest(del.dataset.delete, isAdmin);
    });
  }

  init().catch(() => { $('status').textContent = 'Could not load the tests. Please refresh the page.'; });

}
</script>
</body>
</html>
