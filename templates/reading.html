<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading test</title>
<style>
:root { --surface: #ffffff; --surface-2: #f1f5f9; --notice-bg: #fffaf0; --primary: #1d4ed8; --primary-2: #1e40af; --primary-soft: #eaf1ff; --accent: #f97316; --accent-2: #ea580c; --bg: #f8fafc; --line: #dde3ea; --line-2: #c5cdd8; --text: #111827; --muted: #374151; --danger: #b42318; --danger-bg: #fdecea; --success: #17703a; --success-bg: #e5f4ea; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06); }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
#app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }

/* Top bar: brand on the left, test title in the middle, timer and submit on the right. */
.header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; background:var(--surface); color: var(--primary); padding: 10px 18px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; font-size: 15px; letter-spacing: .04em; color: var(--primary); text-decoration: none; white-space: nowrap; }
.brand span { color: #c2410c; }
.test-title { text-align: center; font-weight: 700; font-size: 16px; }
.header-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.timer { min-width: 76px; text-align: center; background: var(--primary-soft); color: var(--primary); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.warn { background: var(--accent); }
.btn { background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--primary-2); }
.btn:disabled { opacity: .5; cursor: default; background: var(--primary); }

/* Two panes side by side: passage (left) and questions (right), with a draggable divider. */
.split { display: grid; grid-template-columns: 1fr 8px 1fr; min-height: 0; }
.passage, .questions { overflow-y: auto; padding: 24px 32px 48px; min-height: 0; }
.passage { background:var(--surface); line-height: 1.75; }
.passage h2 { margin: 0 0 14px; color: var(--primary); font-size: 21px; }
.passage p { margin: 0 0 14px; text-align: justify; }
.handle { cursor: col-resize; background: var(--line); position: relative; touch-action: none; }
.handle:hover, .handle.dragging { background: var(--line-2); }
.handle::after { content: "⋮"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 16px; }
.questions { background: var(--bg); }

.instr { font-weight: 600; margin-bottom: 18px; padding: 12px 14px; background:var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 6px; }
.qhead { margin-top: 26px; color: var(--primary); font-weight: 700; font-size: 16px; }
.qinstr { margin: 4px 0 12px; color: var(--muted); font-style: italic; white-space: pre-line; }
.notes { background:var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
.nbox { text-align: center; font-size: 18px; margin: 0 0 8px; }
.nh, .noteline, .nt { line-height: 2; margin: 8px 0; }
.nh { font-weight: 700; }
.optbox { background:var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
.optbox div { margin: 4px 0; }
.stmt { background:var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.stmt-text { margin-bottom: 8px; }
.tf label { display: inline-block; margin-right: 18px; cursor: pointer; font-size: 14px; }
.opt { display: block; cursor: pointer; font-size: 14px; margin: 5px 0; }
.qno { display: inline-block; min-width: 26px; height: 22px; line-height: 22px; padding: 0 5px; text-align: center; background: var(--primary); color: #fff; border-radius: 4px; font-size: 12px; font-weight: 700; vertical-align: middle; margin-right: 6px; scroll-margin-top: 80px; }
input.gap { width: 140px; padding: 4px 7px; border: 1px solid var(--line-2); border-radius: 4px; font-size: 14px; margin: 0 4px; vertical-align: middle; background:var(--surface); }
input.short { width: 100%; max-width: 320px; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 6px; font-size: 14px; }
select { padding: 6px 8px; font-size: 14px; max-width: 100%; border: 1px solid var(--line-2); border-radius: 6px; background:var(--surface); }
.summary-text { line-height: 2.1; }
.inline-choice { font: inherit; margin: 0 4px; padding: 2px 4px; }
.result { background:var(--surface); border: 1px solid var(--primary); border-top: 4px solid var(--primary); border-radius: 8px; padding: 18px 20px; margin-bottom: 22px; box-shadow: var(--shadow); }
.result h3 { margin: 0 0 6px; color: var(--primary); }
.result table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
.result th, .result td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); }
.result tr.ok td:last-child { color: var(--success); font-weight: 700; }
.result tr.bad td:last-child { color: var(--danger); font-weight: 700; }
.hl-mark { background: #fff1a8; color: inherit; border-radius: 2px; cursor: pointer; }
.hlbar { position: fixed; z-index: 100; display: flex; gap: 6px; background: var(--primary); border-radius: 8px; padding: 6px; box-shadow: 0 6px 18px rgba(15,23,42,.25); }
.hlbar[hidden] { display: none; }
.hlbar button { background:var(--surface); color: var(--primary); border: none; border-radius: 5px; padding: 6px 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
.hlbar button:hover { background: var(--primary-soft); }
.msg { background: var(--danger-bg); color: var(--danger); padding: 12px 14px; border-radius: 6px; margin: 24px; }

/* Bottom bar: passage tabs and the question number palette. */
.bottom { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background:var(--surface); border-top: 1px solid var(--line); padding: 8px 14px; }
.parts { display: flex; gap: 8px; flex-wrap: wrap; }
.parts button { background:var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 12px; cursor: pointer; text-align: left; line-height: 1.3; }
.parts button small { display: block; color: var(--muted); font-size: 12px; }
.parts button.active { border-color: var(--primary); box-shadow: inset 0 -3px 0 var(--primary); }
.palette { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.chip { min-width: 30px; height: 30px; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 4px; background:var(--surface); cursor: pointer; font-size: 13px; font-weight: 700; }
.chip:hover { border-color: var(--primary); }
.chip.done { background: var(--primary-soft); border-color: var(--primary-2); }
.chip.correct { background: var(--success); border-color: var(--success); color: #fff; }
.chip.incorrect { background: var(--danger); border-color: var(--danger); color: #fff; }

@media (max-width: 820px) {
  #app { height: auto; overflow: visible; grid-template-rows: auto auto auto; }
  .header { grid-template-columns: 1fr; text-align: center; }
  .header-right { justify-content: center; }
  .split { grid-template-columns: 1fr; }
  .handle { display: none; }
  .passage, .questions { overflow: visible; padding: 20px 16px 32px; }
}

/* Dark theme. Switched with the theme button in the header. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #3b82f6; --primary-2: #2563eb; --primary-soft: #172642;
  --accent: #fb923c; --accent-2: #f97316; --accent-text: #fdba74;
  --bg: #0b1220; --surface: #131c2e; --surface-2: #1b2739; --notice-bg: #241d0f;
  --paper: #0b1220; --white: #131c2e; --ink: #e6ebf3;
  --text: #e6ebf3; --muted: #98a2b3;
  --line: #26344a; --line-2: #36455e;
  --danger: #f87171; --danger-bg: #3b1719;
  --success: #4ade80; --success-bg: #123324;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .theme-toggle { color: var(--text); border-color: var(--line-2); }
.theme-toggle { background: transparent; border: 1px solid var(--line-2); color: var(--navy-text, var(--text)); border-radius: 8px; padding: 7px 11px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
.theme-toggle:hover { background: var(--primary-soft); }
</style>
<script>
(function () {
  var KEY = "ielts-theme";
  function current() { try { return localStorage.getItem(KEY) || "light"; } catch (e) { return "light"; } }
  function apply(t) { document.documentElement.setAttribute("data-theme", t); }
  apply(current());
  document.addEventListener("DOMContentLoaded", function () {
    var header = document.querySelector("header");
    if (!header || header.querySelector(".theme-toggle")) return;
    var host = header.querySelector(".header-right, nav, .navlinks, .bar") || header;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "theme-toggle";
    function label() { btn.textContent = current() === "dark" ? "Light mode" : "Dark mode"; }
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      try { localStorage.setItem(KEY, next); } catch (e) {}
      apply(next);
      label();
    });
    label();
    host.appendChild(btn);
  });
})();
</script>
</head>
<body>
<div id="app"></div>
<script>window.TEST_DATA = __TEST_DATA__;<\/script>
<script>
(function () {
  const TEST = window.TEST_DATA;
  const $ = id => document.getElementById(id);
  const L = i => String.fromCharCode(65 + i);
  const TF = { TFNG: ["TRUE", "FALSE", "NOT GIVEN"], YNNG: ["YES", "NO", "NOT GIVEN"] };
  const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = v => String(v == null ? "" : v).toLowerCase().replace(/[.,;:!?]+$/, "").replace(/\s+/g, " ").trim();

  const SHELL = `
    <header class="header">
      <a class="brand" href="index.html">IELTS <span>ACADEMIC</span> READING</a>
      <div class="test-title" id="testTitle"></div>
      <div class="header-right">
        <div class="timer" id="timer">--:--</div>
        <button class="btn" id="submitBtn" type="button">Submit</button>
      </div>
    </header>
    <main class="split" id="split">
      <section class="passage" id="passage"><div id="passageBody"></div></section>
      <div class="handle" id="handle" title="Drag to resize"></div>
      <section class="questions" id="questions"><div id="resultBox"></div><div id="questionsBody"></div></section>
    </main>
    <div class="hlbar" id="hlbar" hidden>
      <button type="button" data-hl="add" id="hlAdd">Highlight</button>
      <button type="button" data-hl="remove" id="hlRemove">Remove highlight</button>
    </div>
    <footer class="bottom">
      <nav class="parts" id="partTabs"></nav>
      <div class="palette" id="palette"></div>
    </footer>`;

  const responses = {};
  const HL_KEY = "ielts-highlights:" + (TEST.id || "preview");
  const hl = loadHighlights(); // { passage: { [part]: [[start, end], ...] }, questions: { ... } }
  let part = 0, submitted = false, secondsLeft = 0, timerId = null, resultHTML = "";
  const markState = {}; // question number -> true (correct) / false (wrong), filled after submit

  function badge(nos) {
    const text = nos.length > 1 ? `${nos[0]}–${nos[nos.length - 1]}` : nos[0];
    return `<span class="qno" id="q${nos[0]}">${text}</span>`;
  }

  function partNumbers(p) {
    return (p.groups || []).flatMap(g => (g.items || []).flatMap(item => item.nos)).sort((a, b) => a - b);
  }

  function isAnswered(no) {
    const v = responses[no];
    return Array.isArray(v) ? v.length > 0 : v != null && v !== "";
  }

  function renderPalette(p) {
    $("palette").innerHTML = partNumbers(p).map(no => {
      const state = markState[no] === true ? "correct" : markState[no] === false ? "incorrect" : isAnswered(no) ? "done" : "";
      return `<button class="chip ${state}" type="button" data-jump="${no}">${no}</button>`;
    }).join("");
  }

  function renderAll() {
    const p = TEST.parts[part];
    const showLabels = (p.labels !== undefined ? p.labels : TEST.labels) !== false;

    $("partTabs").innerHTML = TEST.parts.map((tp, i) => {
      const nos = partNumbers(tp);
      const range = nos.length ? `Questions ${nos[0]}–${nos[nos.length - 1]}` : "";
      return `<button class="${i === part ? "active" : ""}" data-part="${i}">Passage ${i + 1}<small>${range}</small></button>`;
    }).join("");

    $("passageBody").innerHTML = (p.audioUrl ? `<audio controls preload="metadata" src="${esc(p.audioUrl)}" style="width:100%;margin-bottom:18px"></audio>` : "") + `<h2>${esc(p.passageTitle)}</h2>` +
      (p.paragraphs || []).map((t, i) =>
        `<p>${showLabels ? `<strong>${L(i)}</strong>&nbsp;&nbsp;` : ""}${esc(t)}</p>`).join("");

    $("resultBox").innerHTML = resultHTML;
    $("questionsBody").innerHTML =
      (p.instruction ? `<div class="instr">${esc(p.instruction)}</div>` : "") +
      (p.groups || []).map(renderGroup).join("");

    applyHighlights($("passageBody"), (hl.passage[part] || []));
    applyHighlights($("questionsBody"), (hl.questions[part] || []));

    renderPalette(p);
  }

  function renderGroup(g) {
    const dis = submitted ? "disabled" : "";
    const head = `<div class="qhead">${esc(g.heading)}</div>` +
      (g.instruction ? `<div class="qinstr">${esc(g.instruction)}</div>` : "");

    if (g.type === "GAP") {
      const body = (g.lines || []).map(line => {
        const cls = line.kind === "h" ? "nh" : line.kind === "t" ? "nt" : "noteline";
        const html = esc(line.text).replace(/\{(\d+)\}/g, (_, no) =>
          `<span class="qno" id="q${no}">${no}</span><input class="gap" data-no="${no}" value="${esc(responses[no] || "")}" ${dis} autocomplete="off" spellcheck="false">`);
        return `<p class="${cls}">${html}</p>`;
      }).join("");
      return head + `<div class="notes">${g.box ? `<h3 class="nbox">${esc(g.box)}</h3>` : ""}${body}</div>`;
    }

    if (g.type === "MATCH" && g.summary) {
      const options = (g.options || []).map((o, i) => `<div><b>${L(i)}</b> ${esc(o)}</div>`).join("");
      const choose = no => `<select class="inline-choice" data-no="${no}" ${dis}><option value="">— choose —</option>${
        (g.options || []).map((o, i) => `<option value="${L(i)}" ${responses[no] === L(i) ? "selected" : ""}>${L(i)} — ${esc(o)}</option>`).join("")}</select>`;
      const body = String(g.summary).split(/\{(\d+)\}/).map((part, i) => (i % 2 ? badge([Number(part)]) + choose(Number(part)) : esc(part))).join("");
      return head + `<div class="optbox"><strong>Options</strong>${options}</div><p class="summary-text">${body}</p>`;
    }

    if (g.type === "MATCH") {
      const options = (g.options || []).map((o, i) => `<div><b>${L(i)}</b> ${esc(o)}</div>`).join("");
      const rows = (g.items || []).map(item => {
        const no = item.nos[0];
        const opts = (g.options || []).map((o, i) =>
          `<option value="${L(i)}" ${responses[no] === L(i) ? "selected" : ""}>${L(i)} — ${esc(o)}</option>`).join("");
        return `<div class="stmt">
          <div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>
          <select data-no="${no}" ${dis}><option value="">— choose —</option>${opts}</select>
        </div>`;
      }).join("");
      return head + `<div class="optbox"><strong>Options</strong>${options}</div>` + rows;
    }

    return head + (g.items || []).map(item => renderItem(g, item, dis)).join("");
  }

  function renderItem(g, item, dis) {
    const no = item.nos[0];

    if (g.type === "TFNG" || g.type === "YNNG") {
      const opts = TF[g.type].map(o =>
        `<label><input type="radio" name="q${no}" value="${o}" data-no="${no}" ${responses[no] === o ? "checked" : ""} ${dis}> ${o}</label>`).join("");
      return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div><div class="tf">${opts}</div></div>`;
    }

    if (g.type === "MCQ") {
      if (item.multi) {
        const chosen = Array.isArray(responses[no]) ? responses[no] : [];
        const opts = (item.options || []).map((o, i) => {
          const l = L(i);
          return `<label class="opt"><input type="checkbox" data-no="${no}" value="${l}" ${chosen.includes(l) ? "checked" : ""} ${dis}> ${l}. ${esc(o)}</label>`;
        }).join("");
        return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>${opts}</div>`;
      }
      const opts = (item.options || []).map((o, i) => {
        const l = L(i);
        return `<label class="opt"><input type="radio" name="q${no}" value="${l}" data-no="${no}" ${responses[no] === l ? "checked" : ""} ${dis}> ${l}. ${esc(o)}</label>`;
      }).join("");
      return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>${opts}</div>`;
    }

    return `<div class="stmt">
      <div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>
      <input class="short" type="text" data-no="${no}" value="${esc(responses[no] || "")}" ${dis} autocomplete="off">
    </div>`;
  }

  function onAnswer(e) {
    const el = e.target;
    if (submitted || !el.dataset.no) return;
    const no = el.dataset.no;

    if (el.type === "checkbox") {
      const set = new Set(Array.isArray(responses[no]) ? responses[no] : []);
      if (el.checked) set.add(el.value);
      else set.delete(el.value);
      responses[no] = [...set];
    } else if (el.type !== "radio" || el.checked) {
      responses[no] = el.value;
    }
    renderPalette(TEST.parts[part]);
  }

  function markItem(item) {
    if (item.multi) {
      const selected = Array.isArray(responses[item.nos[0]]) ? responses[item.nos[0]] : [];
      const expected = item.answers;
      const ok = selected.length === expected.length && expected.every(a => selected.includes(a));
      return item.nos.map((no, i) => ({ no, ok, mine: selected.join(", "), correct: expected[i] == null ? "" : expected[i] }));
    }
    const no = item.nos[0];
    const mine = responses[no] || "";
    const ok = mine !== "" && item.answers.some(a => norm(a) === norm(mine));
    return [{ no, ok, mine, correct: item.answers.join(" / ") }];
  }

  function submitTest(auto) {
    if (submitted) return;
    submitted = true;
    clearInterval(timerId);
    $("submitBtn").disabled = true;

    const marks = TEST.parts
      .flatMap(p => (p.groups || []).flatMap(g => (g.items || []).flatMap(item => markItem(item))))
      .sort((a, b) => a.no - b.no);

    marks.forEach(m => { markState[m.no] = m.ok; });

    const correct = marks.filter(m => m.ok).length;
    const total = marks.length;
    const pct = total ? Math.round(correct / total * 100) : 0;

    window.saveResult && saveResult(correct, total, responses, marks);

    const rows = marks.map(m =>
      `<tr class="${m.ok ? "ok" : "bad"}"><td>${m.no}</td><td>${esc(m.mine || "—")}</td><td>${esc(m.correct)}</td><td>${m.ok ? "✓" : "✗"}</td></tr>`).join("");

    resultHTML = `<div class="result">
      <h3>Your result${auto ? " (time up)" : ""}</h3>
      <p><strong>${correct} / ${total}</strong> correct (${pct}%)</p>
      <table>
        <thead><tr><th>Q</th><th>Your answer</th><th>Correct answer</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

    renderAll();
    $("questions").scrollTop = 0;
  }

  /* ---------- Highlights ----------
     Highlights are stored as character offsets into the pane's text, so they can be
     put back after a re-render. Input fields and dropdowns are skipped. */
  function loadHighlights() {
    try {
      const v = JSON.parse(localStorage.getItem(HL_KEY) || "null");
      if (v && v.passage && v.questions) return v;
    } catch {}
    return { passage: {}, questions: {} };
  }

  function saveHighlights() {
    try { localStorage.setItem(HL_KEY, JSON.stringify(hl)); } catch {}
  }

  function textNodes(root) {
    const out = [];
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.parentElement && n.parentElement.closest("select, input, textarea, option, script, style, button"))
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    let n;
    while ((n = walker.nextNode())) out.push(n);
    return out;
  }

  // Character offset of a point in the pane's text.
  function offsetOfPoint(root, container, offset) {
    const pre = document.createRange();
    pre.setStart(root, 0);
    pre.setEnd(container, offset);
    let total = 0;
    for (const t of textNodes(root)) {
      if (!pre.intersectsNode(t)) continue;
      total += t === container ? offset : t.length;
    }
    return total;
  }

  function addRange(list, s, e) {
    const all = [...list, [s, e]].sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of all) {
      const last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else merged.push([r[0], r[1]]);
    }
    return merged;
  }

  function subtractRange(list, s, e) {
    const out = [];
    for (const [a, b] of list) {
      if (b <= s || a >= e) { out.push([a, b]); continue; }
      if (a < s) out.push([a, s]);
      if (b > e) out.push([e, b]);
    }
    return out;
  }

  function wrapSegments(node, segs) {
    // Work from the right so the left part of the node keeps its original offsets.
    for (let k = segs.length - 1; k >= 0; k--) {
      const [s, e] = segs[k];
      if (e < node.length) node.splitText(e);
      const mid = s > 0 ? node.splitText(s) : node;
      const mark = document.createElement("mark");
      mark.className = "hl-mark";
      mid.parentNode.insertBefore(mark, mid);
      mark.appendChild(mid);
    }
  }

  function applyHighlights(root, ranges) {
    root.querySelectorAll("mark.hl-mark").forEach(m => {
      const parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
    });
    root.normalize();
    if (!ranges.length) return;
    let pos = 0;
    for (const t of textNodes(root)) {
      const a = pos, b = pos + t.length;
      pos = b;
      const segs = [];
      for (const [s, e] of ranges) {
        const x = Math.max(s, a), y = Math.min(e, b);
        if (x < y) segs.push([x - a, y - a]);
      }
      if (segs.length) wrapSegments(t, segs);
    }
  }

  function setupHighlights() {
    const bar = $("hlbar");
    let pending = null; // { pane, root, part, s, e, kind: "selection" | "mark" }

    function paneFor(node) {
      if ($("passageBody").contains(node)) return { pane: "passage", root: $("passageBody") };
      if ($("questionsBody").contains(node)) return { pane: "questions", root: $("questionsBody") };
      return null;
    }

    function showBar(rect, removeOnly) {
      bar.hidden = false;
      $("hlAdd").hidden = !!removeOnly;
      bar.style.left = "0px";
      const w = bar.offsetWidth;
      bar.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, rect.left + rect.width / 2 - w / 2)) + "px";
      const above = rect.top - bar.offsetHeight - 8;
      bar.style.top = (above >= 8 ? above : rect.bottom + 8) + "px";
    }

    function hideBar() {
      bar.hidden = true;
      pending = null;
    }

    function overlaps(list, s, e) {
      return list.some(([a, b]) => a < e && b > s);
    }

    function updateFromSelection() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount && !sel.getRangeAt(0).collapsed) {
        const r = sel.getRangeAt(0);
        const found = paneFor(r.commonAncestorContainer);
        if (!found) { hideBar(); return; }
        const s = offsetOfPoint(found.root, r.startContainer, r.startOffset);
        const e = offsetOfPoint(found.root, r.endContainer, r.endOffset);
        if (e <= s) { hideBar(); return; }
        const list = hl[found.pane][part] || [];
        pending = { pane: found.pane, root: found.root, part, s, e, kind: "selection" };
        showBar(r.getBoundingClientRect(), false);
        $("hlRemove").hidden = !overlaps(list, s, e);
        return;
      }
      if (pending && pending.kind === "mark") { showBar(pending.rect, true); return; }
      hideBar();
    }

    document.addEventListener("mousedown", e => {
      if (bar.contains(e.target)) { e.preventDefault(); return; } // keep the selection while using the toolbar
      pending = null;
    });
    document.addEventListener("mouseup", () => setTimeout(updateFromSelection, 0));
    document.addEventListener("keyup", () => setTimeout(updateFromSelection, 0));

    // Clicking a highlight offers to remove it.
    document.addEventListener("click", e => {
      const mark = e.target.closest && e.target.closest("mark.hl-mark");
      if (!mark) return;
      const found = paneFor(mark);
      if (!found) return;
      const r = document.createRange();
      r.selectNodeContents(mark);
      const s = offsetOfPoint(found.root, r.startContainer, r.startOffset);
      const en = offsetOfPoint(found.root, r.endContainer, r.endOffset);
      pending = { pane: found.pane, root: found.root, part, s, e: en, kind: "mark", rect: mark.getBoundingClientRect() };
      setTimeout(() => { if (pending && pending.kind === "mark") updateFromSelection(); }, 0);
    });

    bar.addEventListener("click", e => {
      const btn = e.target.closest("[data-hl]");
      if (!btn || !pending) return;
      const { pane, root, part: p, s, e: en } = pending;
      const list = hl[pane][p] || [];
      hl[pane][p] = btn.dataset.hl === "add" ? addRange(list, s, en) : subtractRange(list, s, en);
      saveHighlights();
      applyHighlights(root, hl[pane][p]);
      window.getSelection().removeAllRanges();
      hideBar();
    });

    window.addEventListener("resize", hideBar);
    document.addEventListener("scroll", () => { if (!bar.hidden && pending && pending.kind === "selection") hideBar(); }, true);
  }

  function updateTimer() {
    const left = Math.max(0, secondsLeft);
    $("timer").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    $("timer").classList.toggle("warn", left <= 300);
  }

  // Drag the divider to change how much room the passage and the questions get.
  function setupDivider() {
    const split = $("split"), handle = $("handle");
    let dragging = false;
    handle.addEventListener("pointerdown", e => {
      dragging = true;
      handle.classList.add("dragging");
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener("pointermove", e => {
      if (!dragging) return;
      const rect = split.getBoundingClientRect();
      const share = Math.min(0.75, Math.max(0.25, (e.clientX - rect.left) / rect.width));
      split.style.gridTemplateColumns = `${share * 100}% 8px 1fr`;
    });
    const stop = () => { dragging = false; handle.classList.remove("dragging"); };
    handle.addEventListener("pointerup", stop);
    handle.addEventListener("pointercancel", stop);
  }

  function start() {
    if (!TEST || !Array.isArray(TEST.parts) || !TEST.parts.length) {
      document.getElementById("app").innerHTML = '<div class="msg">This test file is damaged.</div>';
      return;
    }

    document.getElementById("app").innerHTML = SHELL;
    document.title = TEST.title || "Reading test";
    $("testTitle").textContent = TEST.title || "Untitled test";
    secondsLeft = (Number(TEST.time) || 20) * 60;

    $("submitBtn").addEventListener("click", () => {
      if (confirm("Submit the test now?")) submitTest(false);
    });
    $("questions").addEventListener("input", onAnswer);
    $("questions").addEventListener("change", onAnswer);
    $("partTabs").addEventListener("click", e => {
      const b = e.target.closest("[data-part]");
      if (b) { part = Number(b.dataset.part); renderAll(); $("passage").scrollTop = 0; $("questions").scrollTop = 0; }
    });
    $("palette").addEventListener("click", e => {
      const chip = e.target.closest("[data-jump]");
      if (!chip) return;
      const target = $("q" + chip.dataset.jump);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    setupDivider();
    setupHighlights();

    updateTimer();
    timerId = setInterval(() => {
      if (submitted) return;
      secondsLeft--;
      updateTimer();
      if (secondsLeft <= 0) submitTest(true);
    }, 1000);

    renderAll();
  }

  start();
})();
<\/script>

<script>
  window.saveResult = async function (score, total, answers, marks) {
    if (!window.supabase || !window.TEST_DATA || !window.TEST_DATA.id) return;
    const sb = window.supabase.createClient(
      'https://yfsxbiqszvrqhsdcuwyr.supabase.co',
      'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH'
    );
    const { data } = await sb.auth.getSession();
    // Guests (no account) are saved under the nickname chosen on the Tests page.
    const nickname = (function () { try { return (localStorage.getItem('guestNickname') || '').trim(); } catch (e) { return ''; } })();
    if (!data.session && !nickname) return; // no account and no nickname: nothing saved
    if (data.session) {
      // "My results" is only for signed-in students.
      const { error } = await sb.from('results').insert({
        test_id: window.TEST_DATA.id,
        score, total, answers
      });
      if (error) console.error('Could not save result:', error);
    }
    // Teachers review attempts from "submissions", with each answer and the correct one.
    const kind = window.TEST_DATA.type === 'listening' ? 'listening' : 'reading';
    const row = {
      test_id: window.TEST_DATA.id,
      kind,
      answers: { score, total, items: marks || [] }
    };
    if (!data.session) row.guest_name = nickname.slice(0, 40);
    const { error: subError } = await sb.from('submissions').insert(row);
    if (subError) console.error('Could not save submission:', subError);
  };
