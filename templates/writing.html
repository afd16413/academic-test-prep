<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing test</title>
<style>
:root { --surface: #ffffff; --surface-2: #f1f5f9; --notice-bg: #fffaf0; --primary: #1d4ed8; --accent: #f97316; --accent-2: #ea580c; --bg: #f8fafc; --line: #dde3ea; --line-2: #c5cdd8; --text: #111827; --muted: #374151; --danger: #b42318; --danger-bg: #fdecea; --success: #17703a; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
button, textarea { font: inherit; color: inherit; }
.header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--primary); color: #fff; padding: 12px 24px; }
.brand { font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand span { font-weight: 400; opacity: .75; }
a.brand { color: inherit; text-decoration: none; }
.test-title { flex: 1; min-width: 140px; font-size: 14px; opacity: .9; }
.timer { min-width: 76px; text-align: center; background:var(--surface); color: var(--primary); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.warn { background: var(--accent); }
.btn { background: var(--accent); color: var(--primary); border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--accent-2); }
.btn:disabled { opacity: .5; cursor: default; }
.parts { display: flex; gap: 2px; flex-wrap: wrap; background:var(--surface); border-bottom: 1px solid var(--line); padding: 0 24px; }
.parts button { background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); font-size: 14px; font-weight: 600; padding: 12px 16px; cursor: pointer; }
.parts button.active { color: var(--primary); border-bottom-color: var(--primary); }
.split { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 112px); }
.prompt, .answer { overflow: auto; padding: 28px 36px 64px; }
.prompt { background:var(--surface); border-right: 1px solid var(--line); line-height: 1.75; }
.prompt h2 { margin: 0 0 16px; color: var(--primary); font-size: 22px; }
.prompt p { margin: 0 0 14px; }
.instr { white-space: pre-line; font-weight: 600; margin-bottom: 12px; }
.question-box { background:var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 6px; padding: 14px 16px; margin-bottom: 16px; }
.question-box p:last-child { margin-bottom: 0; }
.answer { display: flex; flex-direction: column; gap: 10px; }
textarea.essay { flex: 1; min-height: 320px; width: 100%; padding: 14px; border: 1px solid var(--line-2); border-radius: 8px; background:var(--surface); font-size: 15px; line-height: 1.6; resize: vertical; }
.count { color: var(--muted); font-size: 14px; font-weight: 600; }
.task-img { display: block; max-width: 100%; height: auto; margin: 16px 0 0; border: 1px solid var(--line); border-radius: 8px; background:var(--surface); }
.notice { padding: 12px 14px; border-radius: 8px; font-weight: 600; }
.notice.ok { background:var(--surface); border: 1px solid var(--success); color: var(--success); }
.notice.bad { background: var(--danger-bg); color: var(--danger); }
.time-up { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.time-up-card { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 24px; max-width: 420px; width: 100%; }
.time-up-card h2 { margin: 0 0 8px; color: var(--primary); }
.time-up-card p { margin: 0 0 18px; color: var(--muted); }
.time-up-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.time-up-actions .btn.outline { background: var(--surface); color: var(--primary); border: 1px solid var(--line-2); }
@media (max-width: 820px) {
  .split { grid-template-columns: 1fr; height: auto; }
  .prompt, .answer { padding: 20px 16px 40px; overflow: visible; }
  .header { padding: 10px 14px; }
  .parts { padding: 0 14px; }
}

/* Dark theme. Switched with the theme button in the header. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #3b82f6; --primary-2: #2563eb; --primary-soft: #172642;
  --accent: #fb923c; --accent-2: #f97316; --accent-text: #fdba74;
  --bg: #0b1220; --surface: #131c2e; --surface-2: #1b2739; --notice-bg: #241d0f;
  --paper: #0b1220; --white: #131c2e; --ink: #e6ebf3;
  --text: #e6ebf3; --muted: #98a2b3;
  --line: #26344a; --line-2: #36455e;
  --danger: #f87171; --danger-bg: #3b1719;
  --success: #4ade80; --success-bg: #123324;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .theme-toggle { color: var(--text); border-color: var(--line-2); }
.theme-toggle { background: transparent; border: 1px solid var(--line-2); color: var(--navy-text, var(--text)); border-radius: 8px; padding: 7px 11px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
.theme-toggle:hover { background: var(--primary-soft); }
</style>
<script>
(function () {
  var KEY = "ielts-theme";
  function current() { try { return localStorage.getItem(KEY) || "light"; } catch (e) { return "light"; } }
  function apply(t) { document.documentElement.setAttribute("data-theme", t); }
  apply(current());
  document.addEventListener("DOMContentLoaded", function () {
    var header = document.querySelector("header");
    if (!header || header.querySelector(".theme-toggle")) return;
    var host = header.querySelector(".header-right, nav, .navlinks, .bar") || header;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "theme-toggle";
    function label() { btn.textContent = current() === "dark" ? "Light mode" : "Dark mode"; }
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      try { localStorage.setItem(KEY, next); } catch (e) {}
      apply(next);
      label();
    });
    label();
    host.appendChild(btn);
  });
})();
</script>
</head>
<body>
<div id="app"></div>
<script>window.TEST_DATA = __TEST_DATA__;</script>
<script>
(function () {
  const TEST = window.TEST_DATA;
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const words = t => (String(t || "").trim().match(/\S+/g) || []).length;
  const countText = (t, min) => {
    const n = words(t);
    if (!min) return `${n} words`;
    return `${n} / ${min} words${n < min ? " · below the minimum" : " · minimum reached"}`;
  };

  const SHELL = `
    <header class="header">
      <a class="brand" href="index.html">IELTS <span>Academic Writing</span></a>
      <div class="test-title" id="testTitle"></div>
      <div class="timer" id="timer">--:--</div>
      <button class="btn" id="submitBtn" type="button">Submit</button>
    </header>
    <nav class="parts" id="partTabs"></nav>
    <main class="split">
      <section class="prompt" id="prompt"></section>
      <section class="answer" id="answer"></section>
    </main>`;

  const texts = {};
  let part = 0, submitted = false, secondsLeft = 0, timerId = null, notice = "", noticeBad = false, timeUpShown = false;

  function renderAll() {
    const p = TEST.parts[part];
    $("partTabs").innerHTML = TEST.parts.map((_, i) =>
      `<button class="${i === part ? "active" : ""}" data-part="${i}">Task ${i + 1}</button>`).join("");

    // Layout: instruction (plain text), task prompt in a box, second instruction (plain text),
    // then the Task 1 image (outside the box, still on the left side).
    const box = p.paragraphs && p.paragraphs.length
      ? `<div class="question-box">${p.paragraphs.map(t => `<p>${esc(t)}</p>`).join("")}</div>`
      : "";
    $("prompt").innerHTML = `<h2>${esc(p.passageTitle)}</h2>` +
      (p.instruction ? `<div class="instr">${esc(p.instruction)}</div>` : "") +
      box +
      (p.instruction2 ? `<div class="instr">${esc(p.instruction2)}</div>` : "") +
      (p.imageUrl ? `<img class="task-img" src="${esc(p.imageUrl)}" alt="Task chart or diagram">` : "");

    const cls = noticeBad ? "bad" : "ok";
    $("answer").innerHTML = (notice ? `<div class="notice ${cls}">${esc(notice)}</div>` : "") +
      (submitted ? "" : `<div class="count">You can send Task 1 only, Task 2 only, or both. Write at least one before you submit.</div>`) +
      `<textarea class="essay" id="essay" aria-label="Your answer" ${submitted ? "disabled" : ""}>${esc(texts[part] || "")}</textarea>` +
      `<div class="count" id="count">${countText(texts[part], p.minWords)}</div>`;
  }

  function updateTimer() {
    const left = Math.max(0, secondsLeft);
    $("timer").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    $("timer").classList.toggle("warn", left <= 300);
  }

  // When the time runs out, ask whether to keep writing or submit now. Nothing is sent without a choice.
  function askWhenTimeUp() {
    timeUpShown = true;
    const box = document.createElement("div");
    box.className = "time-up";
    box.innerHTML = `<div class="time-up-card" role="dialog" aria-modal="true" aria-labelledby="timeUpTitle">
      <h2 id="timeUpTitle">Time is up</h2>
      <p>Do you want to keep writing, or submit what you have now?</p>
      <div class="time-up-actions">
        <button type="button" class="btn outline" id="keepWriting">Keep writing</button>
        <button type="button" class="btn" id="submitNow">Submit now</button>
      </div></div>`;
    document.body.appendChild(box);
    box.querySelector("#keepWriting").addEventListener("click", () => {
      box.remove();
      $("timer").textContent = "00:00";
    });
    box.querySelector("#submitNow").addEventListener("click", () => {
      box.remove();
      submitTest(true);
    });
    box.querySelector("#submitNow").focus();
  }

  async function submitTest(auto) {
    if (submitted) return;
    // A student may send Task 1 alone, Task 2 alone, or both, but not an empty submission.
    const anyWritten = TEST.parts.some((_, i) => words(texts[i]) > 0);
    if (!anyWritten) {
      noticeBad = true;
      if (auto) {
        submitted = true;
        clearInterval(timerId);
        $("submitBtn").disabled = true;
        notice = "Time is up, but nothing was written, so nothing was sent.";
      } else {
        notice = "You can only send Task 1 or Task 2. Write at least one of them before you submit.";
      }
      renderAll();
      return;
    }
    submitted = true;
    clearInterval(timerId);
    $("submitBtn").disabled = true;
    const answers = TEST.parts.map((p, i) => ({ task: i + 1, title: p.passageTitle, text: texts[i] || "", words: words(texts[i]) }));
    const error = await window.saveSubmission("writing", answers);
    noticeBad = !!error;
    notice = error
      ? "Could not save your answers: " + error
      : (auto ? "Time is up. " : "") + "Submitted. Your answers have been sent to your teacher.";
    renderAll();
  }

  function start() {
    if (!TEST || !Array.isArray(TEST.parts) || !TEST.parts.length) {
      $("app").innerHTML = '<div class="notice bad" style="margin:24px">This test file is damaged.</div>';
      return;
    }
    $("app").innerHTML = SHELL;
    document.title = TEST.title || "Writing test";
    $("testTitle").textContent = TEST.title || "Untitled test";
    secondsLeft = (Number(TEST.time) || 20) * 60;

    $("submitBtn").addEventListener("click", () => {
      if (confirm("Submit your answers now?")) submitTest(false);
    });
    $("answer").addEventListener("input", e => {
      if (e.target.id !== "essay") return;
      texts[part] = e.target.value;
      $("count").textContent = countText(texts[part], TEST.parts[part].minWords);
    });
    $("partTabs").addEventListener("click", e => {
      const b = e.target.closest("[data-part]");
      if (b) { part = Number(b.dataset.part); renderAll(); }
    });

    updateTimer();
    timerId = setInterval(() => {
      if (submitted || timeUpShown) return;
      secondsLeft--;
      updateTimer();
      if (secondsLeft <= 0) askWhenTimeUp();
    }, 1000);

    renderAll();
  }

  start();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Saves the student's answers to the "submissions" table. Returns an error message, or null on success.
  window.saveSubmission = async function (kind, answers) {
    const TEST = window.TEST_DATA;
    if (!window.supabase) return 'The Supabase library could not load.';
    if (!TEST.id) return 'This test is not published, so nothing was saved.';
    const sb = window.supabase.createClient(
      'https://yfsxbiqszvrqhsdcuwyr.supabase.co',
      'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH'
    );
    const { data } = await sb.auth.getSession();
    // Guests (no account) are saved under the nickname chosen on the Tests page.
    const nickname = (function () { try { return (localStorage.getItem('guestNickname') || '').trim(); } catch (e) { return ''; } })();
    if (!data.session && !nickname) return 'Choose a nickname on the Tests page, so your answers can be saved.';
    const row = { test_id: TEST.id, kind, answers };
    if (!data.session) row.guest_name = nickname.slice(0, 40);
    const { error } = await sb.from('submissions').insert(row);
    return error ? error.message : null;
  };
</script>
</body>
</html>
