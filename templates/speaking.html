<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking test</title>
<style>
:root { --surface: #ffffff; --surface-2: #f1f5f9; --notice-bg: #fffaf0; --primary: #1d4ed8; --accent: #f97316; --accent-2: #ea580c; --bg: #f8fafc; --line: #dde3ea; --line-2: #c5cdd8; --text: #111827; --muted: #374151; --danger: #b42318; --danger-bg: #fdecea; --success: #17703a; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
.header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--primary); color: #fff; padding: 12px 24px; }
.brand { font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand span { font-weight: 400; opacity: .75; }
a.brand { color: inherit; text-decoration: none; }
.test-title { flex: 1; min-width: 140px; font-size: 14px; opacity: .9; }
.timer { min-width: 76px; text-align: center; background:var(--surface); color: var(--primary); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.warn { background: var(--accent); }
.btn { background: var(--accent); color: var(--primary); border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--accent-2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.rec { background: var(--danger); color: #fff; }
.parts { display: flex; gap: 2px; flex-wrap: wrap; background:var(--surface); border-bottom: 1px solid var(--line); padding: 0 24px; }
.parts button { background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); font-size: 14px; font-weight: 600; padding: 12px 16px; cursor: pointer; }
.parts button.active { color: var(--primary); border-bottom-color: var(--primary); }
.split { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 112px); }
.prompt, .answer { overflow: auto; padding: 28px 36px 64px; }
.prompt { background:var(--surface); border-right: 1px solid var(--line); line-height: 1.75; }
.prompt h2 { margin: 0 0 16px; color: var(--primary); font-size: 22px; }
.prompt p { margin: 0 0 14px; }
.instr { font-weight: 600; margin-bottom: 18px; padding: 12px 14px; background:var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 6px; }
.answer { display: flex; flex-direction: column; gap: 14px; }
.card { background:var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.card p { margin: 0 0 12px; color: var(--muted); }
.card audio { width: 100%; margin-top: 12px; }
.notice { padding: 12px 14px; border-radius: 8px; font-weight: 600; }
.notice.ok { background:var(--surface); border: 1px solid var(--success); color: var(--success); }
.notice.bad { background: var(--danger-bg); color: var(--danger); }
@media (max-width: 820px) {
  .split { grid-template-columns: 1fr; height: auto; }
  .prompt, .answer { padding: 20px 16px 40px; overflow: visible; }
  .header { padding: 10px 14px; }
  .parts { padding: 0 14px; }
}

/* Dark theme. Switched with the theme button in the header. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #3b82f6; --primary-2: #2563eb; --primary-soft: #172642;
  --accent: #fb923c; --accent-2: #f97316; --accent-text: #fdba74;
  --bg: #0b1220; --surface: #131c2e; --surface-2: #1b2739; --notice-bg: #241d0f;
  --paper: #0b1220; --white: #131c2e; --ink: #e6ebf3;
  --text: #e6ebf3; --muted: #98a2b3;
  --line: #26344a; --line-2: #36455e;
  --danger: #f87171; --danger-bg: #3b1719;
  --success: #4ade80; --success-bg: #123324;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .theme-toggle { color: var(--text); border-color: var(--line-2); }
.theme-toggle { background: transparent; border: 1px solid var(--line-2); color: var(--navy-text, var(--text)); border-radius: 8px; padding: 7px 11px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
.theme-toggle:hover { background: var(--primary-soft); }
</style>
<script>
(function () {
  var KEY = "ielts-theme";
  function current() { try { return localStorage.getItem(KEY) || "light"; } catch (e) { return "light"; } }
  function apply(t) { document.documentElement.setAttribute("data-theme", t); }
  apply(current());
  document.addEventListener("DOMContentLoaded", function () {
    var header = document.querySelector("header");
    if (!header || header.querySelector(".theme-toggle")) return;
    var host = header.querySelector(".header-right, nav, .navlinks, .bar") || header;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "theme-toggle";
    function label() { btn.textContent = current() === "dark" ? "Light mode" : "Dark mode"; }
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      try { localStorage.setItem(KEY, next); } catch (e) {}
      apply(next);
      label();
    });
    label();
    host.appendChild(btn);
  });
})();
</script>
</head>
<body>
<div id="app"></div>
<script>window.TEST_DATA = __TEST_DATA__;</script>
<script>
(function () {
  const TEST = window.TEST_DATA;
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const SHELL = `
    <header class="header">
      <a class="brand" href="index.html">IELTS <span>Academic Speaking</span></a>
      <div class="test-title" id="testTitle"></div>
      <div class="timer" id="timer">--:--</div>
      <button class="btn" id="submitBtn" type="button">Submit</button>
    </header>
    <nav class="parts" id="partTabs"></nav>
    <main class="split">
      <section class="prompt" id="prompt"></section>
      <section class="answer" id="answer"></section>
    </main>`;

  const recs = {};          // part index -> { blob, url, ext }
  let part = 0, submitted = false, secondsLeft = 0, timerId = null, notice = "";
  let recorder = null, chunks = [];

  const isRecording = () => !!recorder && recorder.state === "recording";

  function renderAll() {
    const p = TEST.parts[part];
    $("partTabs").innerHTML = TEST.parts.map((_, i) =>
      `<button class="${i === part ? "active" : ""}" data-part="${i}">Part ${i + 1}</button>`).join("");

    $("prompt").innerHTML = `<h2>${esc(p.passageTitle)}</h2>` +
      (p.instruction ? `<div class="instr">${esc(p.instruction)}</div>` : "") +
      (p.paragraphs || []).map(t => `<p>${esc(t)}</p>`).join("");

    const rec = recs[part];
    const recording = isRecording();
    const cls = notice.startsWith("Could not") || notice.startsWith("Microphone") ? "bad" : "ok";
    $("answer").innerHTML = (notice ? `<div class="notice ${cls}">${esc(notice)}</div>` : "") +
      `<div class="card">
        <p>${recording ? "Recording… press stop when you have finished." :
            rec ? "Your recording for this part is saved. You can record again to replace it." :
            "Press record and answer the questions for this part."}</p>
        <button class="btn ${recording ? "rec" : ""}" id="recBtn" type="button" ${submitted ? "disabled" : ""}>
          ${recording ? "■ Stop recording" : "● Record"}
        </button>
        ${rec && !recording ? `<audio controls preload="metadata" src="${rec.url}"></audio>` : ""}
      </div>`;
  }

  function stopRecording() {
    return new Promise(resolve => {
      if (!isRecording()) return resolve();
      const done = recorder.onstop;
      recorder.onstop = () => { done(); resolve(); };
      recorder.stop();
    });
  }

  async function toggleRecord() {
    if (submitted) return;
    if (isRecording()) { await stopRecording(); return; }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      notice = "Microphone access is needed to record. Allow it in your browser and try again.";
      renderAll();
      return;
    }
    notice = "";
    chunks = [];
    const pi = part;
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (recs[pi]) URL.revokeObjectURL(recs[pi].url);
      recs[pi] = { blob, url: URL.createObjectURL(blob), ext: blob.type.includes("mp4") ? "mp4" : "webm" };
      renderAll();
    };
    recorder.start();
    renderAll();
  }

  async function submitTest(auto) {
    if (submitted) return;
    await stopRecording();
    submitted = true;
    clearInterval(timerId);
    $("submitBtn").disabled = true;
    const list = TEST.parts.map((p, i) => recs[i] ? { part: i + 1, title: p.passageTitle, blob: recs[i].blob, ext: recs[i].ext } : null).filter(Boolean);
    const error = await window.submitSpeaking(list);
    notice = error
      ? "Could not save your recordings: " + error
      : (auto ? "Time is up. " : "") + "Submitted. Your recordings have been sent to your teacher.";
    renderAll();
  }

  function updateTimer() {
    const left = Math.max(0, secondsLeft);
    $("timer").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    $("timer").classList.toggle("warn", left <= 300);
  }

  function start() {
    if (!TEST || !Array.isArray(TEST.parts) || !TEST.parts.length) {
      $("app").innerHTML = '<div class="notice bad" style="margin:24px">This test file is damaged.</div>';
      return;
    }
    $("app").innerHTML = SHELL;
    document.title = TEST.title || "Speaking test";
    $("testTitle").textContent = TEST.title || "Untitled test";
    secondsLeft = (Number(TEST.time) || 20) * 60;

    $("submitBtn").addEventListener("click", () => {
      if (confirm("Submit your recordings now?")) submitTest(false);
    });
    $("answer").addEventListener("click", e => {
      if (e.target.closest("#recBtn")) toggleRecord();
    });
    $("partTabs").addEventListener("click", e => {
      const b = e.target.closest("[data-part]");
      if (!b) return;
      if (isRecording()) { notice = "Stop the recording before changing parts."; renderAll(); return; }
      part = Number(b.dataset.part);
      notice = "";
      renderAll();
    });

    updateTimer();
    timerId = setInterval(() => {
      if (submitted) return;
      secondsLeft--;
      updateTimer();
      if (secondsLeft <= 0) submitTest(true);
    }, 1000);

    renderAll();
  }

  start();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Uploads each recording to private storage, then saves a "submissions" row that lists them.
  // Returns an error message, or null on success.
  window.submitSpeaking = async function (list) {
    const TEST = window.TEST_DATA;
    if (!window.supabase) return 'The Supabase library could not load.';
    if (!TEST.id) return 'This test is not published, so nothing was saved.';
    const sb = window.supabase.createClient(
      'https://yfsxbiqszvrqhsdcuwyr.supabase.co',
      'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH'
    );
    const { data } = await sb.auth.getSession();
    // Recordings are stored in a private bucket, so only signed-in students can save them.
    if (!data.session) return 'Speaking recordings can only be saved to an account. Sign in to save them.';
    const uid = data.session.user.id;

    const uploaded = [];
    for (const r of list) {
      const path = `${uid}/${TEST.id}/${Date.now().toString(36)}-part${r.part}.${r.ext}`;
      const { error } = await sb.storage.from('speaking-recordings').upload(path, r.blob, { contentType: r.blob.type || 'audio/webm' });
      if (error) return 'Upload failed: ' + error.message;
      uploaded.push({ part: r.part, title: r.title, path });
    }
    const { error } = await sb.from('submissions').insert({ test_id: TEST.id, kind: 'speaking', answers: { recordings: uploaded } });
    return error ? error.message : null;
  };
</script>
</body>
</html>
